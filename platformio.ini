; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; --- Опційна зміна назви USB-пристрою (див. README) ---
; За замовчуванням ВИМКНЕНО (рядок закоментовано) — назва лишається
; стандартною ("RaspberryPi Pico"). Щоб увімкнути: впишіть бажану назву
; у scripts/usb_product_name.py (константа USB_PRODUCT_NAME) і
; розкоментуйте рядок нижче.
; extra_scripts = pre:scripts/usb_product_name.py

[env:pico]
platform = raspberrypi
board = pico
framework = arduino
lib_deps = mryslab/NeoPixelConnect@^1.4.0
build_flags = -DBOARD_ID=1
monitor_speed = 115200

[env:tiny2040]
platform = raspberrypi
board = pico
framework = arduino
lib_deps = 
	mryslab/NeoPixelConnect@^1.4.0
build_flags = -DBOARD_ID=2
monitor_speed = 115200

