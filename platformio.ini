; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; УВАГА: НЕ додавати сюди -flto (link-time optimization). mbed (framework-arduino-mbed)
; не підтримує LTO, і зібрана з -flto прошивка не перелічується на USB — пристрій
; не з'являється як геймпад і його не видно в системі.

[env:pico]
platform = raspberrypi
board = pico
framework = arduino
lib_deps = mryslab/NeoPixelConnect@^1.4.0
build_flags = -DBOARD_ID=1
monitor_speed = 115200

[env:tiny2040]
platform = raspberrypi
board = pico
framework = arduino
lib_deps = 
	mryslab/NeoPixelConnect@^1.4.0
build_flags = -DBOARD_ID=2
monitor_speed = 115200

